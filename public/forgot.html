<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password - FYP Portal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"><link rel="stylesheet" href="css/style.css"></head>
<body><div class="center"><div class="topline"><a class="logo" href="/"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5zM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5M22 9v6"/></svg></i>FYP Portal</a><button type="button" class="a11y-trigger" data-a11y-open aria-expanded="false" aria-controls="a11y-bar"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="4.5" r="2.3"/><path d="M4 8.5l1-1.8 7 1.6 7-1.6 1 1.8-5.5 1.5v3.2l2.3 6.8-1.9.8L12 14.5l-3.9 6.3-1.9-.8L8.5 13.2V10z"/></svg><span>Accessibility</span></button></div>
<div class="mid"><form class="panel" id="f" novalidate style="text-align:left">
<h1>Reset your password</h1><p class="mut" style="margin:6px 0 22px">Enter your email and we will send a reset link.</p>
<div class="field"><label for="em">Email</label><input id="em" type="email" placeholder="name@rcet.edu.pk"><div class="err" id="err" role="alert"></div></div>
<button class="btn" type="submit" style="width:100%">Send reset link</button>
<p id="ok" class="mut" role="status" style="margin-top:14px"></p>
<p style="margin-top:16px;text-align:center"><a href="login.html">Back to sign in</a></p>
</form></div></div>
<script>
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var em=document.getElementById('em'),err=document.getElementById('err'),ok=document.getElementById('ok');err.textContent='';ok.textContent='';
if(!/^\S+@\S+\.\S+$/.test(em.value)){err.textContent='Enter a valid email address.';em.setAttribute('aria-invalid','true');return}
em.removeAttribute('aria-invalid');ok.textContent='Email sending is not set up yet. Please ask the FYP office to reset your password. They will give you a temporary one.'});
</script><script src="js/a11y.js"></script></body></html>
