<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - FYP Portal</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"><link rel="stylesheet" href="css/style.css"></head>
<body><div class="split">
<div class="left"><a class="logo" href="/" style="color:#fff"><i>F</i>FYP Portal</a><h1 style="margin-top:80px">Your final year project, all in one place.</h1><p>Deadlines, documents and feedback without the message chains.</p></div>
<div class="right"><form class="panel" id="f" novalidate>
<h1 style="font-size:26px">Sign in</h1><p class="mut" style="margin-bottom:18px">Use your university email.</p>
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="name@rcet.edu.pk" required></div>
<div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
<p style="margin-bottom:14px"><a href="forgot.html">Forgot your password?</a></p>
<div class="err" id="err" role="alert"></div>
<button class="btn" id="btn" type="submit" style="width:100%">Sign in</button>
<p class="mut" style="margin-top:16px">Need an account? Contact the FYP office.</p>
</form></div></div><script src="js/login.js"></script><script src="js/a11y.js"></script></body></html>
